<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3b53a"/>
      <stop offset="1" stop-color="#7d8c25"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f24"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px body centred in a 1024 canvas, continuous corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- camera -->
  <g filter="url(#shadow)">
    <!-- viewfinder hump -->
    <rect x="392" y="296" width="240" height="90" rx="30" fill="url(#body)"/>
    <!-- body -->
    <rect x="212" y="356" width="600" height="400" rx="72" fill="url(#body)"/>
    <!-- shutter button -->
    <rect x="256" y="318" width="90" height="40" rx="14" fill="#c9d95a"/>
    <!-- flash -->
    <circle cx="742" cy="430" r="22" fill="#e6f08a"/>
  </g>

  <!-- lens -->
  <circle cx="512" cy="556" r="176" fill="url(#lens)"/>
  <circle cx="512" cy="556" r="176" fill="none" stroke="#c9d95a" stroke-width="16"/>
  <circle cx="512" cy="556" r="126" fill="none" stroke="#3a3f47" stroke-width="10"/>

  <!-- upload arrow inside the lens -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 640 V478"/>
    <path d="M436 548 L512 472 L588 548"/>
  </g>
</svg>
